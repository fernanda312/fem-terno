<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FEM TERNO — O poder feminino</title>
<meta name="description" content="FEM TERNO — O poder feminino.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Great+Vibes&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:#111;color:#fff;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .hero{position:relative;height:100svh;min-height:560px;overflow:hidden;background:#f5f1ec;color:#1a1a1a;display:flex;flex-direction:column}
  .stage{position:relative;flex:1;min-height:0}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease;pointer-events:none}
  .slide.active{opacity:1;pointer-events:auto}
  .slide .main{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center}
  .top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:22px 24px}
  .brand{font-family:'Cormorant Garamond',serif;font-weight:400;letter-spacing:.42em;font-size:19px;text-transform:uppercase;color:#1a1a1a}
  .hactions{display:flex;gap:8px;align-items:center}
  .hbtn{padding:10px 16px;border:1px solid #1a1a1a;border-radius:999px;background:transparent;color:#1a1a1a;font-size:12px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;min-height:42px}
  .hbtn:hover{background:#1a1a1a;color:#fff}
  .hero-text{padding:10px 24px 26px;z-index:5}
  .signature{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(56px,12vw,104px);line-height:1;background:linear-gradient(90deg,#111 0%,#7a1216 20%,#c0392b 40%,#e74c3c 50%,#c0392b 60%,#7a1216 80%,#111 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:gradScroll 7s linear infinite}
  @keyframes gradScroll{to{background-position:200% 0}}
  .tagline{margin-top:2px;font-family:'Cormorant Garamond',serif;font-size:clamp(20px,4vw,28px);letter-spacing:.12em;text-transform:uppercase;color:#1a1a1a}
  .hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
  .enter{display:inline-block;padding:14px 30px;border:1px solid #1a1a1a;border-radius:999px;color:#1a1a1a;text-decoration:none;font-size:13px;letter-spacing:.28em;text-transform:uppercase;background:transparent;min-height:48px}
  .enter:hover{background:#1a1a1a;color:#fff}
  .enter.solid{background:#1a1a1a;color:#fff}
  .enter.solid:hover{background:#7a1216;border-color:#7a1216}
  .enter:focus-visible{outline:2px solid #1a1a1a;outline-offset:3px}
  #colecao{background:#f5f1ec;color:#1a1a1a;padding:56px 20px 64px}
  #colecao h2{font-family:'Cormorant Garamond',serif;font-weight:400;text-align:center;letter-spacing:.35em;font-size:20px;text-transform:uppercase}
  #colecao .sig{text-align:center;font-family:'Great Vibes',cursive;font-size:42px;margin-top:6px}
  .grid{max-width:1100px;margin:36px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid img{width:100%;height:auto;display:block;background:#e8e2da}
  footer{background:#111;color:#fff;text-align:center;padding:28px 20px;font-family:'Cormorant Garamond',serif;letter-spacing:.25em;font-size:14px;text-transform:uppercase}
  @media (max-width:640px){
    .top{padding:18px 18px}
    .brand{font-size:16px;letter-spacing:.32em}
    .hero-text{padding:8px 18px 22px}
    .hbtn{padding:9px 12px;font-size:11px;min-height:40px}
      .grid{grid-template-columns:1fr;gap:14px}
    #colecao{padding:44px 16px 52px}
  }
</style>
</head>
<body>
<section class="hero" id="hero" aria-label="FEM TERNO">
  <div class="stage">
  <div class="slide active"><img class="main" src="images/terno-1.jpg" alt="Terno feminino 1"></div>
  <div class="slide"><img class="main" src="images/terno-2.jpg" alt="Terno feminino 2"></div>
  <div class="slide"><img class="main" src="images/loja-15.jpg" alt="Terno feminino 3"></div>
  <div class="slide"><img class="main" src="images/terno-4.jpg" alt="Terno feminino 4"></div>
  <div class="slide"><img class="main" src="images/terno-5.jpg" alt="Terno feminino 5"></div>
  <div class="slide"><img class="main" src="images/terno-6.jpg" alt="Terno feminino 6"></div>
  <div class="slide"><img class="main" src="images/terno-7.jpg" alt="Terno feminino 7"></div>
  <div class="slide"><img class="main" src="images/terno-8.jpg" alt="Terno feminino 8"></div>

  </div>

  <div class="top">
    <div class="brand">FEM TERNO</div>
    <div class="hactions"><button type="button" class="hbtn" id="cartBtn">Carrinho <span class="fem-count" id="cartCount">0</span></button><button type="button" class="hbtn" id="accessBtn">Acesso</button></div>
  </div>

  <div class="hero-text">
    <div class="signature">Fem Terno</div>
    <div class="tagline">O poder feminino.</div>
    <div class="hero-cta"><a class="enter solid" href="loja.html">Ver a loja</a><a class="enter" href="estilista.html">Entrar</a></div>
  </div>

</section>



<script src="fem-cart.js"></script>
<script>
(function(){
  var slides = document.querySelectorAll('.slide');
  var dots = document.querySelectorAll('.dots button');
  var prog = document.getElementById('prog');
  var current = 0;
  var timer = null;
  function show(i){
    current = (i + slides.length) % slides.length;
    slides.forEach(function(s, k){ s.classList.toggle('active', k === current); });
    dots.forEach(function(d, k){ d.classList.toggle('active', k === current); });
    if (prog) { prog.style.transition = 'none'; prog.style.width = '0%'; void prog.offsetWidth; prog.style.transition = 'width 4s linear'; prog.style.width = '100%'; }
  }
  function restart(){
    if (timer) clearInterval(timer);
    timer = setInterval(function(){ show(current + 1); }, 4000);
  }
  var startX = null;
  var hero = document.getElementById('hero');
  hero.addEventListener('touchstart', function(e){ startX = e.touches[0].clientX; }, {passive:true});
  hero.addEventListener('touchend', function(e){
    if (startX === null) return;
    var dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 40){ show(current + (dx < 0 ? 1 : -1)); restart(); }
    startX = null;
  }, {passive:true});
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) { show(current); restart(); } });
  show(0);
  restart();
})();
</script>
</body>
</html>
