<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FEM TERNO — O poder feminino</title>
<meta name="description" content="FEM TERNO — O poder feminino.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Great+Vibes&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:#111;color:#fff;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .hero{position:relative;height:100svh;min-height:560px;overflow:hidden;background:#111}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease;pointer-events:none}
  .slide.active{opacity:1;pointer-events:auto}
  .slide .blur{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;filter:blur(28px) brightness(.55);transform:scale(1.05)}
  .slide .main{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 45%,rgba(0,0,0,.25) 100%);pointer-events:none}
  .top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:22px 24px}
  .brand{font-family:'Cormorant Garamond',serif;font-weight:400;letter-spacing:.42em;font-size:19px;text-transform:uppercase}
  .counter{font-size:12px;letter-spacing:.25em;opacity:.85}
  .hero-text{position:absolute;left:24px;right:24px;bottom:34px;z-index:5}
  .signature{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(56px,12vw,104px);line-height:1;text-shadow:0 2px 30px rgba(0,0,0,.45)}
  .tagline{margin-top:2px;font-family:'Cormorant Garamond',serif;font-size:clamp(20px,4vw,28px);letter-spacing:.12em;text-transform:uppercase}
  .enter{display:inline-block;margin-top:20px;padding:13px 34px;border:1px solid rgba(255,255,255,.9);border-radius:999px;color:#fff;text-decoration:none;font-size:13px;letter-spacing:.28em;text-transform:uppercase;background:rgba(0,0,0,.18);backdrop-filter:blur(4px)}
  .enter:hover{background:#fff;color:#111}
  .dots{position:absolute;right:24px;bottom:38px;z-index:6;display:flex;gap:8px}
  .dots button{width:26px;height:3px;border:0;background:rgba(255,255,255,.35);cursor:pointer;padding:0}
  .dots button.active{background:#fff}
  .dots button:focus-visible,.enter:focus-visible{outline:2px solid #fff;outline-offset:3px}
  #colecao{background:#f5f1ec;color:#1a1a1a;padding:56px 20px 64px}
  #colecao h2{font-family:'Cormorant Garamond',serif;font-weight:400;text-align:center;letter-spacing:.35em;font-size:20px;text-transform:uppercase}
  #colecao .sig{text-align:center;font-family:'Great Vibes',cursive;font-size:42px;margin-top:6px}
  .grid{max-width:1100px;margin:36px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid img{width:100%;height:auto;display:block;background:#e8e2da}
  footer{background:#111;color:#fff;text-align:center;padding:28px 20px;font-family:'Cormorant Garamond',serif;letter-spacing:.25em;font-size:14px;text-transform:uppercase}
  @media (max-width:640px){
    .top{padding:18px 18px}
    .brand{font-size:16px;letter-spacing:.32em}
    .hero-text{left:18px;right:18px;bottom:64px}
    .dots{left:18px;right:auto;bottom:26px}
    .grid{grid-template-columns:1fr;gap:14px}
    #colecao{padding:44px 16px 52px}
  }
</style>
</head>
<body>
<section class="hero" id="hero" aria-label="FEM TERNO">
  <div class="slide active"><img class="blur" src="images/terno-1.jpg" alt="" aria-hidden="true"><img class="main" src="images/terno-1.jpg" alt="Terno feminino 1"></div>
  <div class="slide"><img class="blur" src="images/terno-2.jpg" alt="" aria-hidden="true"><img class="main" src="images/terno-2.jpg" alt="Terno feminino 2"></div>
  <div class="slide"><img class="blur" src="images/terno-3.jpg" alt="" aria-hidden="true"><img class="main" src="images/terno-3.jpg" alt="Terno feminino 3"></div>
  <div class="slide"><img class="blur" src="images/terno-4.jpg" alt="" aria-hidden="true"><img class="main" src="images/terno-4.jpg" alt="Terno feminino 4"></div>
  <div class="slide"><img class="blur" src="images/terno-5.jpg" alt="" aria-hidden="true"><img class="main" src="images/terno-5.jpg" alt="Terno feminino 5"></div>
  <div class="slide"><img class="blur" src="images/terno-6.jpg" alt="" aria-hidden="true"><img class="main" src="images/terno-6.jpg" alt="Terno feminino 6"></div>
  <div class="slide"><img class="blur" src="images/terno-7.jpg" alt="" aria-hidden="true"><img class="main" src="images/terno-7.jpg" alt="Terno feminino 7"></div>
  <div class="slide"><img class="blur" src="images/terno-8.jpg" alt="" aria-hidden="true"><img class="main" src="images/terno-8.jpg" alt="Terno feminino 8"></div>

  <div class="top">
    <div class="brand">FEM TERNO</div>
    <div class="counter"><span id="num">01</span> / 08</div>
  </div>

  <div class="hero-text">
    <div class="signature">Fem Terno</div>
    <div class="tagline">O poder feminino.</div>
    <a class="enter" href="estilista.html">Entrar</a>
  </div>

  <div class="dots" role="group" aria-label="Mudar de foto">
    <button type="button" class="active" data-go="0" aria-label="Foto 1"></button>
    <button type="button" data-go="1" aria-label="Foto 2"></button>
    <button type="button" data-go="2" aria-label="Foto 3"></button>
    <button type="button" data-go="3" aria-label="Foto 4"></button>
    <button type="button" data-go="4" aria-label="Foto 5"></button>
    <button type="button" data-go="5" aria-label="Foto 6"></button>
    <button type="button" data-go="6" aria-label="Foto 7"></button>
    <button type="button" data-go="7" aria-label="Foto 8"></button>
  </div>
</section>



<script>
(function(){
  var slides = document.querySelectorAll('.slide');
  var dots = document.querySelectorAll('.dots button');
  var num = document.getElementById('num');
  var current = 0;
  var timer = null;
  function show(i){
    current = (i + slides.length) % slides.length;
    slides.forEach(function(s, k){ s.classList.toggle('active', k === current); });
    dots.forEach(function(d, k){ d.classList.toggle('active', k === current); });
    num.textContent = String(current + 1).padStart(2, '0');
  }
  function restart(){
    if (timer) clearInterval(timer);
    timer = setInterval(function(){ show(current + 1); }, 4500);
  }
  dots.forEach(function(d){
    d.addEventListener('click', function(){
      show(parseInt(d.getAttribute('data-go'), 10));
      restart();
    });
  });
  var startX = null;
  var hero = document.getElementById('hero');
  hero.addEventListener('touchstart', function(e){ startX = e.touches[0].clientX; }, {passive:true});
  hero.addEventListener('touchend', function(e){
    if (startX === null) return;
    var dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 40){ show(current + (dx < 0 ? 1 : -1)); restart(); }
    startX = null;
  }, {passive:true});
  restart();
})();
</script>
</body>
</html>
